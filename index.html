<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="page_title">Elisa e Giovanni</title>
    <meta name="description" data-i18n-content="meta_description" content="Il nostro matrimonio: informazioni, conferma presenza e giochi per gli invitati.">
    <meta name="theme-color" content="#2f4a2c">
    <link rel="icon" type="image/png" href="assets/images/gelsomino_small.png">

    <!-- <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 96V38' stroke='%234a6a2f' stroke-width='6' stroke-linecap='round'/%3E%3Cg fill='%23d9a441'%3E%3Cellipse cx='36' cy='70' rx='10' ry='17' transform='rotate(-28 36 70)'/%3E%3Cellipse cx='64' cy='70' rx='10' ry='17' transform='rotate(28 64 70)'/%3E%3Cellipse cx='36' cy='46' rx='10' ry='17' transform='rotate(-28 36 46)'/%3E%3Cellipse cx='64' cy='46' rx='10' ry='17' transform='rotate(28 64 46)'/%3E%3Cellipse cx='50' cy='22' rx='10' ry='18'/%3E%3C/g%3E%3C/svg%3E">-->
    <script src="js/language.js" data-language-file="lang.json" defer></script>
    <!-- ?v=4 forces browsers to download the new stylesheet; bump it after future CSS edits -->
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <!-- Reusable wheat symbol for the animated hero scene. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
        <symbol id="ear" viewBox="0 0 24 120"><path d="M12 118V30" stroke="#a98a2f" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <g fill="#d9a441"><ellipse cx="7.5" cy="52" rx="3.6" ry="7" transform="rotate(-28 7.5 52)"/><ellipse cx="16.5" cy="52" rx="3.6" ry="7" transform="rotate(28 16.5 52)"/><ellipse cx="7.5" cy="40" rx="3.6" ry="7" transform="rotate(-28 7.5 40)"/><ellipse cx="16.5" cy="40" rx="3.6" ry="7" transform="rotate(28 16.5 40)"/><ellipse cx="7.5" cy="28" rx="3.6" ry="7" transform="rotate(-28 7.5 28)"/><ellipse cx="16.5" cy="28" rx="3.6" ry="7" transform="rotate(28 16.5 28)"/><ellipse cx="12" cy="14" rx="3.6" ry="8"/></g></symbol>
    </defs></svg>

    <!-- Language selector, positioned in the upper-right corner. -->
    <div class="lang-switcher">
        <select id="lang-select" data-i18n-aria-label="language_label" aria-label="Lingua">
            <option value="it">Italiano</option>
            <option value="en">English</option>
        </select>
    </div>

    <!-- Hero section -->
    <header class="hero">
        <div class="scene" aria-hidden="true">
            <div class="sun"></div><span class="cloud c1"></span><span class="cloud c2"></span>
            <svg class="hills" viewBox="0 0 1440 300" preserveAspectRatio="none">
                <path fill="#9db873" d="M0 150C200 90 420 140 700 105S1180 60 1440 120V300H0Z"/>
                <path fill="#6c8f40" d="M0 190C260 130 520 200 800 160S1250 130 1440 175V300H0Z"/>
                <path fill="#3f5c2b" d="M0 235C300 195 560 250 860 215S1260 200 1440 232V300H0Z"/>
            </svg>
            <div class="wheat"></div>
        </div>
        <div class="hero-content">
            <h1 data-i18n="title">Elisa e Giovanni</h1>
            <p class="date">00.00.2027</p>
            <p class="location" data-i18n="location">Milano, Italia</p>
            <a href="#rsvp" class="btn" data-i18n="rsvp_btn">Conferma Presenza (RSVP)</a>
        </div>
    </header>

    <!-- Main navigation -->
    <nav class="navbar">
        <a href="#info" data-i18n="nav_info">Info Utili</a>
        <a href="giochi/index.html" class="nav-games" data-i18n="nav_games">Area Giochi</a>
    </nav>

    <!-- Wedding information -->
    <section id="info" class="container">
        <h2 data-i18n="details_title">Dettagli</h2>
        <div class="grid">
            <div class="card">
                <h3 data-i18n="ceremony_title">Cerimonia</h3>
                <p data-i18n="ceremony_time">Ore 11:00 - Chiesa ?</p>
                <p>?, Milano</p>
            </div>
            <div class="card">
                <h3 data-i18n="reception_title">Ricevimento</h3>
                <p data-i18n="reception_time">Ore 11:00 - Dove?</p>
                <p>?, Milano</p>
            </div>
        </div>
    </section>

    <!-- RSVP form -->
    <section id="rsvp" class="container bg-light">
        <h2 data-i18n="rsvp_title">Ci sarai?</h2>
        <p data-i18n="rsvp_subtitle">Ti preghiamo di confermare la tua presenza entro il 28 febbraio.</p>
        
        <form class="rsvp-form" id="rsvp-form">
            <!-- Use data-i18n-placeholder to translate input placeholder text. -->
            <input type="text" name="nome" autocomplete="name" maxlength="100" data-i18n-placeholder="form_name" placeholder="Nome e Cognome" required>
            <input type="email" name="email" autocomplete="email" maxlength="120" data-i18n-placeholder="form_email" placeholder="La tua Email" required>
            <select name="presenza" required>
                <option value="" disabled selected data-i18n="form_select_default">Parteciperai?</option>
                <option value="si" data-i18n="form_select_yes">Sì, verrò con gioia!</option>
                <option value="no" data-i18n="form_select_no">Purtroppo non potrò esserci</option>
            </select>
            <textarea name="note" maxlength="500" data-i18n-placeholder="form_notes" placeholder="Allergie, intolleranze o note particolari..."></textarea>
            <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
            <button type="submit" class="btn" data-i18n="form_submit">Invia Conferma</button>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
    </section>

    <footer>
        <div class="farmyard" aria-hidden="true">
            <svg class="hen" viewBox="0 0 120 100">
                <path d="M24 54C8 42 6 22 14 10C22 22 28 30 36 46Z" fill="#e2cfa5"/>
                <path d="M26 56C14 52 6 40 6 30C16 36 24 42 32 50Z" fill="#d3bd8a"/>
                <ellipse cx="55" cy="58" rx="34" ry="26" fill="#f6ecd6"/>
                <path d="M38 56C48 44 68 46 76 60C66 72 46 72 38 56Z" fill="#e2cfa5"/>
                <path d="M52 82V95M64 82V95M46 95H58M60 95H72" stroke="#d28b2a" stroke-width="3" stroke-linecap="round"/>
                <g class="head">
                    <path d="M70 52C74 36 80 30 86 28L96 40C90 50 82 58 76 62Z" fill="#f6ecd6"/>
                    <circle cx="90" cy="28" r="11" fill="#f6ecd6"/>
                    <circle cx="85" cy="16" r="4.2" fill="#c0392b"/><circle cx="91" cy="14" r="4.4" fill="#c0392b"/><circle cx="96.5" cy="17" r="4" fill="#c0392b"/>
                    <path d="M100 25L113 31L100 35Z" fill="#e4a22e"/>
                    <ellipse cx="98" cy="41" rx="3" ry="5" fill="#c0392b"/>
                    <circle cx="94" cy="26" r="1.8" fill="#2a2f23"/>
                </g>
            </svg>
            <svg class="chick" viewBox="0 0 40 40">
                <path d="M17 33V39M24 33V39" stroke="#d28b2a" stroke-width="2" stroke-linecap="round"/>
                <circle cx="19" cy="24" r="11" fill="#f4c64a"/><circle cx="27" cy="14" r="7" fill="#f4c64a"/>
                <path d="M33 13L40 16L33 18Z" fill="#e4a22e"/><circle cx="29" cy="12.5" r="1.3" fill="#2a2f23"/>
            </svg>
        </div>
        <p data-i18n="footer_text">Benvenuti!</p>
    </footer>

    <!-- Animations and RSVP submission to Google Sheets -->
    <script>
        // Paste the deployed Google Apps Script /exec URL here to enable RSVP submissions.
        const RSVP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0jAJ3EqsdIt_wEyQf3s-CM9SGQ7Xm51rfMruCpFllTc3dzXqG8Xw0hgTp4KWnVcdwhQ/exec";

        (function () {
            const form = document.getElementById("rsvp-form");
            const status = document.getElementById("form-status");
            let language = localStorage.getItem("wedding-language") || localStorage.getItem("selectedLanguage") || "it";
            const messages = { sending: "form_sending", ok: "form_success", error: "form_error", config: "form_config" };
            const say = (key, cls) => {
                status.className = "form-status " + (cls || "");
                status.textContent = window.weddingTranslations?.[language]?.[messages[key]] || "";
            };
            document.addEventListener("languageChanged", event => { language = event.detail.language; });

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                if (!RSVP_SCRIPT_URL) { say("config", "err"); return; }
                const f = new FormData(form);
                const btn = form.querySelector("button[type=submit]");
                btn.disabled = true; say("sending");
                try {
                    await fetch(RSVP_SCRIPT_URL, {
                        method: "POST", mode: "no-cors", cache: "no-cache",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ nome: f.get("nome"), email: f.get("email"), presenza: f.get("presenza"), note: f.get("note"), website: f.get("website") })
                    });
                    form.reset(); say("ok", "ok");
                } catch (err) { say("error", "err"); }
                btn.disabled = false;
            });
        })();

        // Generate the wheat stalks that sway in the hero scene.
        (function () {
            const box = document.querySelector(".wheat"); if (!box) return;
            const n = Math.round(innerWidth / 34); let html = "";
            for (let i = 0; i < n; i++) {
                const hgt = 70 + Math.random() * 90, left = (i / n) * 100 + Math.random() * 1.5;
                html += `<svg class="stalk" viewBox="0 0 24 120" style="left:${left}%;height:${hgt}px;width:${hgt * 0.2}px;opacity:${0.75 + Math.random() * 0.25};animation-duration:${3 + Math.random() * 3}s;animation-delay:${-Math.random() * 5}s"><use href="#ear"/></svg>`;
            }
            box.innerHTML = html;
        })();

        // Reveal content as it enters view and add a shadow to the navbar on scroll.
        (function () {
            const nav = document.querySelector(".navbar");
            const onScroll = () => nav.classList.toggle("scrolled", window.scrollY > 10);
            addEventListener("scroll", onScroll, { passive: true }); onScroll();

            if (!("IntersectionObserver" in window)) return;
            const els = document.querySelectorAll(".container h2, .container > p, .card, .rsvp-form");
            document.querySelectorAll(".grid").forEach(g => [...g.children].forEach((c, i) => c.style.setProperty("--d", i * 0.15 + "s")));
            const io = new IntersectionObserver((entries) => entries.forEach(en => {
                if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
            }), { threshold: 0.15 });
            els.forEach(el => { el.classList.add("reveal"); io.observe(el); });
        })();
    </script>

</body>
</html>
