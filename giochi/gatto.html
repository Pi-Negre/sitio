<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Wedding Catcher</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fcfbfa; text-align: center; margin: 0; padding: 10px; color: #333; }
        .game-container { max-width: 450px; margin: 10px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #e76f51; font-family: Georgia, serif; font-size: 1.8rem; margin-bottom: 5px; }
        #canvas-container { margin-top: 15px; position: relative; }
        canvas { background: #ffe5ec; border: 4px solid #ffb3c1; border-radius: 8px; display: block; margin: 0 auto; max-width: 100%; cursor: none; }
        .controls-info { font-size: 0.85rem; color: #666; margin-top: 10px; }
        .mobile-btns { display: none; justify-content: center; gap: 20px; margin-top: 15px; }
        .btn-dir { background: #ffb3c1; color: white; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem; font-weight: bold; cursor: pointer; }
        .btn-start { background: #e76f51; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 15px; }
        @media (max-width: 768px) { .mobile-btns { display: flex; } }
    </style>
</head>
<body>

    <div class="game-container">
        <h1 id="game-title">🐱 Cat Wedding Catcher</h1>
        <p id="game-subtitle">Aiuta il gattino a prendere le fedi per il matrimonio!</p>

        <div id="setup-screen">
            <button class="btn-start" id="btn-play" onclick="startGame()">Inizia! 🚀</button>
        </div>

        <div id="canvas-container" style="display: none;">
            <canvas id="catCanvas" width="360" height="500"></canvas>
            <div class="controls-info" id="controls-text">Muovi il mouse o usa le Frecce della tastiera per spostare il gatto.</div>
            <div class="mobile-btns">
                <button class="btn-dir" onclick="moveLeft()">◀</button>
                <button class="btn-dir" onclick="moveRight()">▶</button>
            </div>
        </div>
    </div>

    <a href="index.html" style="color: #888; text-decoration: none; font-size: 0.9rem; display: inline-block; margin-top: 15px;" id="link-back">⬅️ Torna all'Area Giochi</a>

    <script src="gatto-logic.js"></script>
</body>
</html>
