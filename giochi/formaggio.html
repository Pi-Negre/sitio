<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Che Formaggio Sei?</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fcfbfa; color: #333; text-align: center; padding: 20px; }
        .quiz-container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 8px solid #f4a261; }
        h1 { color: #e76f51; font-family: Georgia, serif; }
        .question { font-size: 1.3rem; font-weight: bold; margin: 25px 0; color: #264653; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .btn-opt { background: #f4f1de; border: 2px solid #e0dbcd; padding: 14px; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: 0.2s; text-align: left; }
        .btn-opt:hover { background: #ffe8d6; border-color: #f4a261; }
        #result-box { display: none; padding: 20px; }
        .cheese-title { font-size: 2rem; font-weight: bold; color: #e76f51; margin: 15px 0; }
        .cheese-desc { font-size: 1.1rem; line-height: 1.6; color: #555; background: #fdf0d5; padding: 20px; border-radius: 8px; }
        .btn-home { display: inline-block; background: #e76f51; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; margin-top: 25px; text-decoration: none; }
        .back-link { display: inline-block; margin-top: 20px; color: #888; text-decoration: none; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1> Che Prodotto Lidl sei?</h1>
        <p>Rispondi sinceramente alle domande per scoprire la tua vera identità!</p>
        
        <div id="quiz-game">
            <p id="progress" style="color: #888; font-weight: bold;"></p>
            <div class="question" id="question-text">Caricamento...</div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="result-box">
            <h2>Il tuo prodotto Lidl è...</h2>
            <div class="cheese-title" id="cheese-name"></div>
            <p class="cheese-desc" id="cheese-description"></p>
            <a href="../index.html" class="btn-home">Torna al Sito 🏠</a>
        </div>
    </div>
    
    <a href="index.html" class="back-link">⬅️ Torna all'Area Giochi</a>

    <script>
        // Le domande del test. Ogni risposta assegna un "profilo" (ceci, riso, latte condensato, verdurine)
        const domande = [
            {
                q: "Oggi piove e allora...",
                opts: [
                    { text: "Scendo per strada e cominci a correre sotto la pioggia", profile: "ceci" },
                    { text: "Sto in casa sotto le coperte", profile: "latte_condensato" },
                    { text: "Chiami i tuoi genitori per sapere se anche da loro piove", profile: "riso" },
                    { text: "Fai delle foto per Instagram.", profile: "verdurine" }
                ]
            },
            {
                q: "Un tuo collega ti invita fuori a pranzo ma non vuoi andarci, come rispondi?",
                opts: [
                    { text: "'No, non ho voglia.'", profile: "ceci" },
                    { text: "'Bellissima idea, vengo subito', ma poi non ti presenti all'appuntamento!", profile: "verdurine" },
                    { text: "'Grazie mille per l'offerta, ma c'ho una cosa da fare'", profile: "latte_condensato" },
                    { text: "'Bellissima idea, vengo subito' ti unisci al pranzo e soffri in silenzio", profile: "riso" }
                ]
            },
            {
                q: "Vuoi organizzare la tua festa di compleanno, cosa fai?",
                opts: [
                    { text: "Non ho tanta voglia, ma vedere i miei amici mi farà bene e quindi organizzo una cena a casa", profile: "riso" },
                    { text: "Comincio a chiamare tutti i miei numeri in rubrica per dire che ho affittato la terrazza del Duomo per il compleanno.", profile: "verdurine" },
                    { text: "Le feste di compleanno fanno schifo, compiere gli anni mi deprime, non organizzo nulla", profile: "ceci" },
                    { text: "Invito tutti fuori per una birra che offrirò io", profile: "latte_condensato" }
                ]
            },
            {
                q: "Devi arredare casa, a chi ti rivolgi?",
                opts: [
                    { text: "Al miglior studio di design di Milano, non mi importa del prezzo. L'estetica è l'unica cosa di cui mi importa", profile: "verdurine" },
                    { text: "A nessuno, posso benissimo fare da solo.", profile: "ceci" },
                    { text: "Al mio youtuber preferito. Guarderò tutti i suoi video in due giorni e poi mi costruirò tutti i mobilida solo.", profile: "latte_condensato" },
                    { text: "Ho un amico designer, gli scrivo un messaggio perchè chiamarlo mi sembra troppo.", profile: "riso" }
                ]
            },
            {
                q: "Devi fare la spesa per il mese, quale è il tuo budget?",
                opts: [
                    { text: "5€", profile: "ceci" },
                    { text: "50€", profile: "riso" },
                    { text: "100€", profile: "latte_condensato" },
                    { text: "200€", profile: "verdurine" }
                ]
            },
            {
                q: "Oggi è il primo giorno di scuola di tuo figlio, cosa gli dici?",
                opts: [
                    { text: "'Goditi questo giorno perchè sarà unico.'", profile: "riso" },
                    { text: "'Goditela finchè sei alle elementari, perchè dopo è molto peggio.'", profile: "latte_condensato" },
                    { text: "Nulla, imparerà sbagliando", profile: "ceci" },
                    { text: "'Cerca di dare il meggio e prendere il massimo in tutte le materie''", profile: "verdurine" }
                ]
            },
            {
                q: "La memoria del tuo telefono è piena e devi eliminare delle foto e video, cosa fai?",
                opts: [
                    { text: "Le foto sono troppo importanti per me, compro dello spazio di google cloud", profile: "verdurine"},
                    { text: "Seleziona tutto ed elimina", profile: "ceci" },
                    { text: "Faccio un backup ed elimino le foto", profile: "latte_condensato" },
                    { text: "Non so fare un backup quindi spendo 5 ore a selezionare le mie foto preferite ed elimino le altre", profile: "riso"  }
                ]
            }
        ];

        // I profili dei formaggi con i loro risultati
        const profiliFormaggio = {
            ceci: {
                name: "Ceci secchi (Il Saggio Burbero)",
                desc: "La tua educazione è stata dura ma sei quello che ogni studente con un budget ristretto vuole. Hai un grande futuro come educatore anche se non lo vuoi ammettere. Sei deciso, duro e ruvido come la vita."
            },
            riso: {
                name: "Riso (Dal cuore d'oro)",
                desc: "Ti sai adattare, ti fai andare bene tutto come accompagnamento, verdure, pollo, frutto, tutti stanno bene con te. Sei versatile, puoi essere un pregiato risotto o una calorosa insalata di riso. Eppure a volte vorresti stare un'po da solo."
            },
            latte_condensato: {
                name: "Latte condensato (L'anticonformista)",
                desc: "Sei una rarità prelibata. Dal gusto deciso che non fa per tutti. La tua generosità è travolgente, ti farest in quattro per gli altri, ma non scendi a compromessi. A volte la gente ti considera un outsider o una persona bizzarra, ma a te non importa tanto."
            },
            verdurine: {
                name: "Verdurine (La regina)",
                desc: "Sei una persona dolce, calorosa e super affettuosa. Vuoi sempre il meglio per te e i tuoi amici, ma sei abbastanza picky e non tutti riescono a starti accanto. Ogni occasione è buona per migliorare la tua condizione. Sei decisa e agguerrita e non ti arrendi mai."
            }
        };

        let currentQ = 0;
        // Teniamo il conto di quante volte viene scelto ogni profilo
        let punteggi = { ceci: 0, riso: 0, latte_condensato: 0, verdurine: 0 };

        function loadQuestion() {
            if (currentQ >= domande.length) {
                showResult();
                return;
            }

            document.getElementById("progress").innerText = `Domanda ${currentQ + 1} di ${domande.length}`;
            const data = domande[currentQ];
            document.getElementById("question-text").innerText = data.q;

            const container = document.getElementById("options-container");
            container.innerHTML = "";

            data.opts.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "btn-opt";
                btn.innerText = opt.text;
                btn.onclick = () => {
                    punteggi[opt.profile]++; // Aggiunge un punto al profilo corrispondente
                    currentQ++;
                    loadQuestion();
                };
                container.appendChild(btn);
            });
        }

        function showResult() {
            document.getElementById("quiz-game").style.display = "none";
            document.getElementById("result-box").style.display = "block";

            // Trova il profilo con il punteggio più alto
            let formaggioVincente = Object.keys(punteggi).reduce((a, b) => punteggi[a] > punteggi[b] ? a : b);
            const risultato = profiliFormaggio[formaggioVincente];

            document.getElementById("cheese-name").innerText = risultato.name;
            document.getElementById("cheese-description").innerText = risultato.desc;
        }

        loadQuestion();
    </script>
</body>
</html>
