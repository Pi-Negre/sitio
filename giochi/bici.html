<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bike Escape - Wedding Edition</title>
<script src="../js/language.js" data-language-file="../lang.json"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../language-switcher.css">
<link rel="stylesheet" href="bici-style.css">

<link rel="stylesheet" href="../navigation.css">
</head>
<body data-city="milano" data-char="sposo">
<div class="bg m"></div><div class="bg b"></div>

<main class="shell">
  <div class="lang-switcher"><select id="lang-select" aria-label="Language / Lingua"><option value="it">Italiano</option><option value="en">English</option></select></div>
  <h1 data-i="title">Bike Escape</h1>
  <p class="sub" data-i="subtitle"></p>

  <section id="setup" class="panel enter">
    <div class="namebox"><p class="step" data-i="nameLabel"></p><input id="player-name" type="text" maxlength="30" autocomplete="name"><p id="name-err" role="alert"></p></div>
    <p class="step" data-i="char"></p>
    <div class="choices char" role="group">
      <button class="choice" data-char="sposo" aria-pressed="true">
        <div class="pic"><svg class="art" preserveAspectRatio="xMidYMax slice" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 64c0-14 10-22 24-22s24 8 24 22Z" fill="#1d2a44"/><path d="M26 42l6 12 6-12Z" fill="#fff"/><path d="M28 47l4 2-4 2ZM36 47l-4 2 4 2Z" fill="#a82e3a"/><circle cx="32" cy="26" r="11" fill="#f1c7a0"/><path d="M21 25c0-9 6-13 11-13s11 4 11 13c-3-5-8-6-11-6s-8 1-11 6Z" fill="#2b2118"/></svg><img src="../assets/images/sposo.png" alt="" onload="this.parentNode.classList.add('has-photo')" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='../assets/images/sposo.jpg'}else{this.remove()}"></div>
        <strong data-i="sposo"></strong><small data-i="sposoSub"></small>
      </button>
      <button class="choice" data-char="sposa" aria-pressed="false">
        <div class="pic"><svg class="art" preserveAspectRatio="xMidYMax slice" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6C18 6 12 20 12 36c0 8 4 14 4 14l6-8V26c0-6 5-10 10-10s10 4 10 10v16l6 8s4-6 4-14C52 20 46 6 32 6Z" fill="#fff" stroke="#d9cfc0" stroke-width="1.2"/><path d="M10 64c0-10 6-16 14-18h16c8 2 14 8 14 18Z" fill="#fdfaf3" stroke="#d9cfc0" stroke-width="1.2"/><circle cx="32" cy="29" r="10" fill="#f1c7a0"/><path d="M22 28c0-8 5-12 10-12s10 4 10 12c-3-4-7-5-10-5s-7 1-10 5Z" fill="#6b4226"/><circle cx="32" cy="15" r="4" fill="#6b4226"/><circle cx="26" cy="50" r="2.6" fill="#e58aa5"/><circle cx="32" cy="52" r="2.6" fill="#f4c6d2"/><circle cx="38" cy="50" r="2.6" fill="#e58aa5"/></svg><img src="../assets/images/sposa.png" alt="" onload="this.parentNode.classList.add('has-photo')" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='../assets/images/sposa.jpg'}else{this.remove()}"></div>
        <strong data-i="sposa"></strong><small data-i="sposaSub"></small>
      </button>
    </div>

    <p class="step" data-i="city"></p>
    <div class="choices" role="group">
      <button class="choice" data-city="milano" aria-pressed="true">
        <div class="pic"><svg class="art" preserveAspectRatio="xMidYMax slice" viewBox="0 0 120 64" aria-hidden="true"><g fill="#8d939c"><rect x="12" y="44" width="96" height="20"/><path d="M12 44V36l12-6 12 6 12-8 12 8h24l12-8 12 8 12 6v8Z" fill="#a7adb5"/><path d="M20 44V26l3-14 3 14v18ZM32 44V22l3-16 3 16v18ZM44 44V20l3-14 3 14v24ZM56 44V16l4-12 4 12v28ZM70 44V20l3-14 3 14v24ZM82 44V22l3-16 3 16v22ZM94 44V26l3-14 3 14v18Z"/></g><circle cx="60" cy="4" r="2.4" fill="#d9a441"/><g fill="#6c727a"><rect x="30" y="50" width="6" height="10" rx="3"/><rect x="57" y="50" width="6" height="14" rx="3"/><rect x="84" y="50" width="6" height="10" rx="3"/></g></svg><img src="../assets/images/milano.jpg" alt="" onload="this.parentNode.classList.add('has-photo')" onerror="this.remove()"></div>
        <strong data-i="milano"></strong><small data-i="milanoSub"></small>
      </button>
      <button class="choice" data-city="barcellona" aria-pressed="false">
        <div class="pic"><svg class="art" preserveAspectRatio="xMidYMax slice" viewBox="0 0 120 64" aria-hidden="true"><circle cx="96" cy="16" r="11" fill="#f4b94a"/><g fill="#c9784a"><rect x="30" y="20" width="9" height="44" rx="2"/><rect x="45" y="10" width="9" height="54" rx="2"/><rect x="60" y="14" width="9" height="50" rx="2"/><rect x="75" y="24" width="9" height="40" rx="2"/><ellipse cx="34.5" cy="20" rx="4.5" ry="8"/><ellipse cx="49.5" cy="10" rx="4.5" ry="9"/><ellipse cx="64.5" cy="14" rx="4.5" ry="9"/><ellipse cx="79.5" cy="24" rx="4.5" ry="8"/></g><g fill="#e0584a"><circle cx="34.5" cy="10" r="2"/><circle cx="49.5" cy="0" r="2"/><circle cx="64.5" cy="4" r="2"/><circle cx="79.5" cy="14" r="2"/></g><path d="M14 64V34" stroke="#7a5230" stroke-width="3" fill="none"/><g fill="#3f8f55"><ellipse cx="6" cy="34" rx="9" ry="3.5" transform="rotate(-20 6 34)"/><ellipse cx="22" cy="34" rx="9" ry="3.5" transform="rotate(20 22 34)"/><ellipse cx="14" cy="28" rx="3.5" ry="9"/></g></svg><img src="../assets/images/barcellona.jpg" alt="" onload="this.parentNode.classList.add('has-photo')" onerror="this.remove()"></div>
        <strong data-i="barcellona"></strong><small data-i="barcellonaSub"></small>
      </button>
    </div>
    <button class="btn" id="btn-play" data-i="play"></button>
  </section>

  <section id="stage" class="panel" hidden>
    <div class="hud"><span id="hud-city"></span><span id="hud-lvl"></span><span id="hud-dist"></span></div>
    <div class="track" aria-hidden="true"><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div>
    <div class="canvas-wrap" id="wrap">
      <canvas id="gameCanvas" width="360" height="500"></canvas>
      <div class="flash"></div><div class="toast" id="toast"></div><div class="scorebox"><span id="hud-score">0</span><small id="hud-combo"></small></div>
      <div class="overlay" id="count"><div class="big" id="count-n"></div></div>
      <div class="overlay" id="end">
        <svg id="end-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
        <h2 id="end-title"></h2><p id="end-msg"></p><p class="score" id="end-score"></p><p class="stats" id="end-stats"></p>
        <div class="row"><button class="btn" id="btn-again" data-i="again"></button><button class="btn ghost" id="btn-change" data-i="change"></button></div>
      </div>
    </div>
    <p class="hint kbd" data-i="controls"></p><p class="hint touch" data-i="touch"></p><p class="hint" data-i="scoreHint"></p>
    <div class="pad"><button id="pad-l" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button id="pad-r" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
  </section>

  <section id="board" class="panel board"><h2 class="step" data-i="boardTitle"></h2>
    <table><thead><tr><th data-i="thPos"></th><th data-i="thName"></th><th data-i="thCity"></th><th data-i="thScore"></th></tr></thead><tbody id="board-body"></tbody></table>
  </section>
</main>

<a href="index.html" class="back-link" id="link-back" data-i="back"></a>
<script src="bici-init.js" defer></script>
<script src="bici-logic.js"></script>
</body>
</html>
