<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding GeoGuesser</title>
    <!-- CSS di Leaflet per la mappa interattiva -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <!-- Colleghiamo lo stile grafico personalizzato esterno -->
    <link rel="stylesheet" href="geoguesser-style.css" />
</head>
<body>

    <div class="game-container">
        <h1 id="game-title">🗺️ Wedding GeoGuesser</h1>
        <p id="game-subtitle" class="subtitle">Indovina dove abbiamo scattato questa foto della nostra storia!</p>

        <!-- Selettore di Lingua -->
        <div class="lang-switcher-container">
            <select id="lang-select" onchange="switchLanguage(this.value)">
                <option value="it">🇮🇹 Italiano</option>
                <option value="en">🇬🇧 English</option>
            </select>
        </div>

        <!-- FASE 1: INSERIMENTO NOME -->
        <div id="name-zone" class="name-screen">
            <p id="name-instruction">Inserisci il tuo nome e cognome per iniziare a giocare:</p>
            <input type="text" id="player-name-input" class="input-name" placeholder="Esempio: Mario Rossi"><br>
            <button class="btn" onclick="startActualGame()" id="btn-start-label">Inizia il Gioco 🚀</button>
        </div>

        <!-- FASE 2: SCHERMATA DI GIOCO -->
        <div id="game-zone" style="display: none;">
            <p id="progress-text" class="progress-label"></p>
            
            <div class="game-layout">
                <div class="photo-column">
                    <img id="current-photo" src="" class="wedding-photo" alt="Tappa">
                </div>
                <div class="map-column">
                    <div id="map"></div>
                </div>
            </div>

            <button id="action-btn" class="btn" onclick="handleButtonClick()">Invia Risposta 📍</button>

            <div id="result-box" class="result-box">
                <h3 id="distance-result">Distanza...</h3>
                <p id="anecdote-text" class="anecdote"></p>
                
                <!-- Tabella della Classifica -->
                <div id="leaderboard-zone" style="display: none; margin-top: 25px;">
                    <h3 id="leaderboard-title" class="board-heading">🏆 Top 10 Classifica</h3>
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Pos.</th>
                                <th id="th-name">Invitato</th>
                                <th id="th-score">Errore Totale</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                            <tr><td colspan="3" style="text-align:center;" id="loading-text">Caricamento...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <a href="index.html" class="back-link" id="link-back">⬅️ Torna all'Area Giochi</a>
<script src="https://unpkg.com"></script>
<script src="geoguesser-logic.js"></script>
</body>
</html>
