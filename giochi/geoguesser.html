<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding GeoGuesser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Load the custom stylesheet for the game. -->
    <link rel="stylesheet" href="geoguesser-style.css" />
</head>
<body>

    <div class="game-container">
        <h1 id="game-title">🗺️ Wedding GeoGuesser</h1>
        <p id="game-subtitle" class="subtitle">Indovina dove abbiamo scattato questa foto della nostra storia!</p>

        <!-- Language selector -->
        <div class="lang-switcher-container">
            <select id="lang-select" onchange="switchLanguage(this.value)">
                <option value="it">🇮🇹 Italiano</option>
                <option value="en">🇬🇧 English</option>
            </select>
        </div>

        <!-- Stage 1: enter the player's name -->
        <div id="name-zone" class="name-screen">
            <p id="name-instruction">Inserisci il tuo nome e cognome per iniziare a giocare:</p>
            <input type="text" id="player-name-input" class="input-name" placeholder="Esempio: Mario Rossi" autocomplete="name" maxlength="100"><br>
            <button class="btn" onclick="startActualGame()" id="btn-start-label">Inizia il Gioco 🚀</button>
        </div>

        <!-- Stage 2: play the game -->
        <div id="game-zone" style="display: none;">
            <p id="progress-text" class="progress-label"></p>
            
            <div class="game-layout" id="game-layout">
                <div class="photo-column">
                    <img id="current-photo" src="" class="wedding-photo" alt="Tappa">
                </div>
                <div class="map-column">
                    <div id="map"></div>
                </div>
            </div>

            <button id="action-btn" class="btn" onclick="handleButtonClick()">Invia Risposta 📍</button>

            <div id="result-box" class="result-box">
                <h3 id="distance-result">Distanza...</h3>
                <p id="anecdote-text" class="anecdote"></p>
                
                <!-- Leaderboard -->
                <div id="leaderboard-zone" style="display: none; margin-top: 25px;">
                    <h3 id="leaderboard-title" class="board-heading">🏆 Top 10 Classifica</h3>
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                <th id="th-position">Pos.</th>
                                <th id="th-name">Invitato</th>
                                <th id="th-score">Errore Totale</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                            <tr><td colspan="3" style="text-align:center;" id="loading-text">Caricamento...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <a href="index.html" class="back-link" id="link-back">⬅️ Torna all'Area Giochi</a>
    
    <!-- Load Leaflet before the game script, which uses its map API. -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="geoguesser-logic.js"></script>
</body>
</html>
