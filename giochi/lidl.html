<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js/language.js" data-language-file="../lang.json"></script>
<title>Che Prodotto Lidl Sei?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../language-switcher.css">
<link rel="stylesheet" href="lidl-style.css">

<link rel="stylesheet" href="../navigation.css">
</head>
<body>
<header class="band">
  <div class="lang-switcher">
    <select id="lang-select" aria-label="Language / Lingua"><option value="it">Italiano</option><option value="en">English</option></select>
  </div>
  <h1>Che prodotto Lidl sei?</h1>
  <p>Rispondi sinceramente alle domande per scoprire la tua vera identità!</p>
</header>

<main class="quiz-container">
  <section id="quiz-game">
    <div class="steps" id="steps" aria-hidden="true"></div>
    <p id="progress"></p>
    <div class="card" id="card">
      <div class="badge" id="badge" aria-hidden="true"></div>
      <h2 class="question" id="question-text" aria-live="polite"></h2>
      <div class="options-grid" id="options-container"></div>
    </div>
  </section>

  <section id="scan-box" hidden>
    <div class="scanner"><div class="bars" id="scan-bars"></div></div>
    <p id="scan-text">Passo il tuo profilo alla cassa…</p>
  </section>

  <section id="result-box" hidden>
    <div class="tag" id="tag">
      <div class="price" id="price"></div>
      <p class="kicker">Il tuo prodotto Lidl è…</p>
      <div class="product-art" id="product-art"></div>
      <div class="cheese-title" id="cheese-name"></div>
      <div class="nick" id="cheese-nick"></div>
      <div class="bars" id="tag-bars"></div>
      <p class="note" id="cheese-note"></p>
    </div>
    <p class="cheese-desc" id="cheese-description"></p>
    <div class="match"><h3>Compatibilità con gli altri prodotti</h3><div id="match-rows"></div></div>
    <div class="actions">
      <button class="btn ghost" id="restart">Rifai il test</button>
      <a href="../index.html" class="btn">Torna al Sito</a>
    </div>
  </section>
</main>

<a href="index.html" class="back-link">← Torna all'Area Giochi</a>
<script src="lidl-logic.js"></script>
</body>
</html>
